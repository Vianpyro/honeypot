# HoneyLab: PostgreSQL + the ingest API + the Cloudflare tunnel client.
#
# THIS FILE IS THE ONE DEFINITION OF THE STACK. The Ansible role
# (VHome: roles/honeypot) clones this repository onto the host and runs THIS
# file; it renders only the `.env` beside it. A second, Jinja copy of the same
# services in the role would be two things to keep in agreement, and the one
# that drifts is always the one you are not looking at.
#
# NOTHING IS PUBLISHED ON THE HOST. Not PostgreSQL, not the API, not
# cloudflared -- there is no `ports:` key anywhere below and there must never
# be one. The only way in is the tunnel, and the only way to reach the database
# is `docker compose exec`.
#
# NO SECRET IS IN THIS FILE. Everything sensitive arrives through `.env`, which
# is 0600, git-ignored, and rendered by Ansible from the vault. See .env.example.

name: honeypot

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    container_name: honeypot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeypot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot}
      # Deterministic collation, set at initdb time. A cluster restored into a
      # different libc collation has silently wrong index ordering on TEXT.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      # Postgres 18 keeps PGDATA under the versioned path; naming it explicitly
      # is what stops a future image bump from initialising an empty cluster
      # beside the real one. Same shape as the collabst stack on this host.
      - postgres_data:/var/lib/postgresql/18/docker
    # `db` ONLY, and `db` is `internal: true`. This container has no route to
    # the internet and no route from it -- not even out. The pg_dump for the
    # backups runs through `docker exec`, which needs no network at all.
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeypot} -d ${POSTGRES_DB:-honeypot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-1.0}"
          memory: ${POSTGRES_MEM_LIMIT:-512m}

  api:
    build:
      context: ./api
    # TAGGED BY COMMIT, not `latest` or `local`, and this is load-bearing.
    #
    # The image is built from the checkout, so "is it current" is a question
    # about the checkout -- but a fixed tag makes every build LOOK present, and
    # Compose has no way to know the code moved. That shipped a stale image: a
    # commit added a second binary, the tag already existed, nothing rebuilt,
    # and the new container died on `no such file or directory`. Worse, it could
    # not recover -- the next converge saw an unchanged checkout and rebuilt
    # nothing again.
    #
    # A commit-shaped tag makes the question answer itself: new commit, new tag,
    # genuinely absent image, built. Same commit, tag present, nothing done --
    # so the converge stays idempotent without ever forcing a rebuild.
    #
    # Ansible renders HONEYPOT_IMAGE_TAG from the checked-out revision. It
    # defaults to `local` for a hand-run `docker compose` from a clone.
    image: honeypot-api:${HONEYPOT_IMAGE_TAG:-local}
    # THIS SERVICE IS ALWAYS BUILT AND NEVER PULLED, and saying so is not
    # cosmetic. `honeypot-api:local` exists only in the host's image store, so
    # the default policy makes Compose ask Docker Hub for it first and print
    #     pull access denied for honeypot-api, repository does not exist
    #     or may require 'docker login'
    # on every first build. It is harmless -- the build runs straight after --
    # but an "unauthorized" line in the deploy of a honeypot is exactly the
    # false alarm that sends someone hunting for a missing credential.
    #
    # NOT `build`, which was tried first: it forces a build on every `up`, and
    # BuildKit stamps a fresh attestation each time, so the image id changes,
    # the container is Recreated and the API restarts on every converge.
    # `never` builds only what is missing and leaves a converged host alone.
    pull_policy: never
    container_name: honeypot-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-honeypot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      # key-id:base64url-secret pairs, comma-separated. Rotation is a second
      # pair here plus a Worker that starts sending the new X-Honeypot-Key-Id.
      HONEYPOT_HMAC_KEYS: ${HONEYPOT_HMAC_KEYS:?HONEYPOT_HMAC_KEYS must be set in .env}
      HONEYPOT_RETENTION_DAYS: ${HONEYPOT_RETENTION_DAYS:-100}
      HONEYPOT_DB_MAX_CONNECTIONS: ${HONEYPOT_DB_MAX_CONNECTIONS:-16}
      RUST_LOG: ${RUST_LOG:-honeypot_api=info,tower_http=warn}
      TZ: ${TZ:-America/Montreal}
    depends_on:
      postgres:
        condition: service_healthy
    # BOTH networks, and both are internal. `db` is the only route to Postgres;
    # `edge` is the only route from cloudflared. The API therefore has no
    # outbound internet access whatsoever -- which is the cheap structural
    # answer to SSRF and to exfiltration from a compromised ingest path, since
    # this service legitimately needs to reach nothing at all.
    networks:
      - db
      - edge
    expose:
      - "8080"
    # The process writes nothing to disk. A read-only root filesystem is
    # therefore free, and removes the "drop a binary and exec it" step from
    # anything that gets code execution here.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NO /var/run/docker.sock, ever. The socket is root-equivalent on a host
    # that also serves this network's DNS, DHCP and password vault.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: ${API_MEM_LIMIT:-256m}

  # THE ONE COMPONENT WITH A WAY OUT, and it is a separate container for exactly
  # that reason. Reporting to AbuseIPDB is an outbound call; the API must not be
  # able to make one (see the networks below), so the capability lives in a
  # process that listens on nothing and is on no network a request can arrive
  # from. It reads PostgreSQL and talks to one external host.
  #
  # Same image as the API -- one `cargo build` produces both binaries -- so this
  # is a different entrypoint, not a second thing to build and keep in step.
  #
  # INERT WITHOUT A KEY: it aggregates, logs what it would have sent, and
  # submits nothing until ABUSEIPDB_KEY is set. No profile needed for that.
  reporter:
    # The SAME tag as the API above -- one build, two binaries. Compose builds
    # it for the `api` service before starting anything, so this service never
    # needs a build section of its own.
    image: honeypot-api:${HONEYPOT_IMAGE_TAG:-local}
    # Never fetched: this tag exists only in the host's image store.
    pull_policy: never
    container_name: honeypot-reporter
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/honeypot-reporter"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-honeypot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-honeypot}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      # Four calls a day. AbuseIPDB's Webmaster tier allows ten, and the same
      # address is deduplicated for two days -- a shorter interval spends quota
      # without reporting anyone sooner.
      HONEYPOT_REPORT_INTERVAL_HOURS: ${HONEYPOT_REPORT_INTERVAL_HOURS:-6}
      HONEYPOT_REPORT_WINDOW_HOURS: ${HONEYPOT_REPORT_WINDOW_HOURS:-48}
      HONEYPOT_REPORT_MIN_EVENTS: ${HONEYPOT_REPORT_MIN_EVENTS:-5}
      HONEYPOT_ALLOWLIST_ASNS: ${HONEYPOT_ALLOWLIST_ASNS:-}
      # ITS OWN VARIABLE, not the API's RUST_LOG. Sharing one filter is how
      # this process ends up silent: the deployed RUST_LOG names
      # `honeypot_api` and `tower_http`, neither of which is this crate.
      RUST_LOG: ${REPORTER_LOG:-honeypot_reporter=info}
      TZ: ${TZ:-America/Montreal}
    depends_on:
      postgres:
        condition: service_healthy
    # `db` to read the events, `egress` to reach AbuseIPDB. NOT `edge`: nothing
    # may send this process a request, which is what keeps its outbound
    # capability from being reachable by anything the honeypot ingests.
    networks:
      - db
      - egress
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No healthcheck: this is a timer, not a server. It has nothing to answer on
    # and a process that is running IS the health condition. Its cycles are
    # visible in the logs -- `report cycle` every six hours.
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "${REPORTER_CPU_LIMIT:-0.5}"
          memory: ${REPORTER_MEM_LIMIT:-128m}

  # PREPARED, NOT DEPLOYED. Behind the `tunnel` profile, so `docker compose up`
  # starts postgres and the API and leaves this alone; it comes up only with
  # `--profile tunnel`, which the Ansible role passes when
  # honeypot_cloudflared_enabled is true and a token exists.
  #
  # Without the profile a tokenless container would crash-loop on every host
  # that has not been given a tunnel yet, which is a red stack reporting a
  # decision nobody has made.
  cloudflared:
    profiles: ["tunnel"]
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.8.1}
    container_name: honeypot-cloudflared
    restart: unless-stopped
    # A REMOTELY-MANAGED tunnel: the token is the entire configuration, and it
    # is a secret, so it lives in .env and nothing about the tunnel (its id, its
    # credentials, its hostname) is committed here.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # PLAIN `${...}`, not the `:?` required-variable form used above. Compose
      # interpolates the WHOLE file before it applies profiles, so a `:?` here
      # makes every `docker compose` command fail on a host that has no tunnel
      # yet -- including the ones that only start postgres and the API.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
      TUNNEL_METRICS: "127.0.0.1:2000"
    # `edge` reaches the API; `egress` is the only non-internal network in this
    # file and exists solely so this container can dial Cloudflare. It is NOT on
    # `db`: a compromised tunnel client cannot open a connection to PostgreSQL.
    #
    # The tunnel is OUTBOUND ONLY. No inbound port is published, opened or
    # forwarded -- that is the whole reason for this shape rather than a port on
    # the router.
    networks:
      - edge
      - egress
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65532:65532"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "${CLOUDFLARED_CPU_LIMIT:-0.5}"
          memory: ${CLOUDFLARED_MEM_LIMIT:-128m}

networks:
  # `internal: true` on both: no gateway, no NAT, no route off the host. The
  # only container with a way out is cloudflared, through `egress` below.
  db:
    internal: true
  edge:
    internal: true
  egress:

volumes:
  postgres_data:
